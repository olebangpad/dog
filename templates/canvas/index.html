<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixSpell starter: plain canvas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101712; color: #e8f3e4; font: 14px system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    canvas { image-rendering: pixelated; width: 768px; max-width: 96vw; }
    p { text-align: center; opacity: .7; }
  </style>
</head>
<body>
<main>
  <canvas id="game" width="256" height="176"></canvas>
  <p>Arrows / WASD to move · Space to attack · M to mute</p>
</main>
<script type="module">
// PixSpell starter: one HTML file, no install, no build step.
// Every sprite below is generated by PixSpell in the browser.
// Change HERO to any character from the maker (https://olebangpad.github.io/pixspell/#maker).

import { spell, text } from 'https://cdn.jsdelivr.net/gh/olebangpad/pixspell@main/src/index.js'

const HERO = { body: 'hero', hat: 'crown', hand: 'sword', offhand: 'shield' }
const ENEMY = { body: 'slime' }
const T = 16, COLS = 16, ROWS = 11
const canvas = document.getElementById('game')
const ctx = canvas.getContext('2d')
ctx.imageSmoothingEnabled = false

// --- build every animation once; the game loop only calls drawImage()
// An animation knows its frame at time t (.atTime), its length (.duration) and its .origin: the point that goes at
// (x, y), here the character's feet. Each image keeps a .canvas for drawImage.
const draw = (frames, x, y, t) => ctx.drawImage(frames.atTime(t).canvas, Math.round(x) - frames.origin[0], Math.round(y) - frames.origin[1])
function sprites(spec) {
  const attack = spell.action(spec, 'attack') // actions face right
  return {
    walk: Object.fromEntries(spell.walk.dirs.map((d) => [d, spell.walk(spec, d)])),
    attack: { right: attack, left: attack.flipX() },
    hit: spell.action(spec, 'hit', { amount: '-1' }),
    death: spell.action(spec, 'death'),
  }
}
const hero = { ...sprites(HERO), x: 128, y: 96, dir: 'down', state: 'walk', t: 0 }
// sounds are code too: the hero's weapon picks its swing sound (sword -> 'slash')
const swing = spell.sfx(spell.action.styleOf(HERO)), hitSound = spell.sfx('hit'), poof = spell.sfx('poof')
const enemySprites = sprites(ENEMY)

// --- the map, drawn once: grass, a sandy path that blends into it (an autotile), trees around the edge
const path = Array.from({ length: ROWS }, (_, r) => Array.from({ length: COLS }, (_, c) => r === 5 || (c === 8 && r > 5)))
let map = spell.autotile('dirt-sand', 'grass').draw(path)
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  if (r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1) map = map.draw(spell((r + c) % 3 ? 'tree' : 'tree-autumn'), c * T, r * T)
}
const background = map.canvas
const inside = (x, y) => x > T + 4 && x < (COLS - 1) * T - 4 && y > T + 8 && y < (ROWS - 1) * T

// --- enemies
let enemies = []
let score = 0
function spawn() {
  enemies.push({ x: 40 + Math.random() * 176, y: 40 + Math.random() * 100, vx: 0, vy: 0, hp: 2, state: 'walk', t: 0, turn: 0 })
}
for (let i = 0; i < 4; i++) spawn()

// --- input
const keys = new Set()
addEventListener('keydown', (e) => {
  keys.add(e.key.toLowerCase())
  spell.music.play('field') // music needs a key press first (browser rules); the same track again just keeps playing
  if (e.key === ' ') { e.preventDefault(); attack() }
  if (e.key.toLowerCase() === 'm') spell.mute(!spell.mute())
})
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()))
const held = (...names) => names.some((n) => keys.has(n))

function attack() {
  if (hero.state !== 'walk') return
  hero.state = 'attack'
  hero.t = 0
  swing.play() // fine here: browsers allow audio that starts from a key press
  const dx = { left: -1, right: 1 }[hero.dir] ?? 0, dy = { up: -1, down: 1 }[hero.dir] ?? 0
  for (const e of enemies) {
    if (e.state !== 'walk') continue
    if (Math.abs(e.x - (hero.x + dx * 14)) < 16 && Math.abs(e.y - (hero.y + dy * 14)) < 16) {
      e.hp--
      e.state = e.hp > 0 ? 'hit' : 'death'
      e.t = 0
      ;(e.hp > 0 ? hitSound : poof).play()
    }
  }
}

// --- game loop
let last = performance.now()

function tick(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000))
  last = now

  // hero
  hero.t += dt
  if (hero.state === 'attack' && hero.t >= hero.attack.right.duration) hero.state = 'walk'
  let mx = 0, my = 0
  if (hero.state === 'walk') {
    mx = held('arrowright', 'd') - held('arrowleft', 'a')
    my = held('arrowdown', 's') - held('arrowup', 'w')
    if (mx || my) hero.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'right' : 'left') : (my > 0 ? 'down' : 'up')
    const nx = hero.x + mx * 60 * dt, ny = hero.y + my * 60 * dt
    if (inside(nx, ny)) { hero.x = nx; hero.y = ny }
  }

  // enemies wander; hit and death animations play once
  for (const e of enemies) {
    e.t += dt
    if (e.state === 'walk') {
      if ((e.turn -= dt) <= 0) { e.vx = (Math.random() - 0.5) * 40; e.vy = (Math.random() - 0.5) * 40; e.turn = 1 + Math.random() * 2 }
      if (inside(e.x + e.vx * dt, e.y + e.vy * dt)) { e.x += e.vx * dt; e.y += e.vy * dt } else e.turn = 0
    } else if (e.state === 'hit' && e.t >= enemySprites.hit.duration) e.state = 'walk'
    else if (e.state === 'death' && e.t >= enemySprites.death.duration) { e.gone = true; score++; setTimeout(spawn, 800) }
  }
  enemies = enemies.filter((e) => !e.gone)

  // draw: map, then everyone sorted by y so nearer things overlap farther ones
  ctx.drawImage(background, 0, 0)
  const actors = [...enemies.map((e) => ({ e, hero: false })), { e: hero, hero: true }].sort((a, b) => a.e.y - b.e.y)
  for (const { e, hero: isHero } of actors) {
    const s = isHero ? hero : enemySprites
    if (e.state === 'walk') draw(s.walk[isHero ? hero.dir : 'down'], e.x, e.y, isHero && !mx && !my ? 0 : e.t) // standing still: frame 0
    else if (e.state === 'attack') draw(hero.attack[hero.dir === 'left' ? 'left' : 'right'], e.x, e.y, e.t)
    else draw(s[e.state], e.x, e.y, e.t) // hit and death play once, then hold
  }
  ctx.drawImage(scoreLabel(score), 4, 4)
  requestAnimationFrame(tick)
}

// pixel-font text from PixSpell, cached per value
const labels = new Map()
function scoreLabel(n) {
  if (!labels.has(n)) labels.set(n, text(`SLIMES ${n}`, { color: '#ffffff' }).outline('#1b1225').canvas)
  return labels.get(n)
}

requestAnimationFrame(tick)
</script>
</body>
</html>
