<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DOG Quest · demo</title>
  <meta name="description" content="A tiny playable demo where every pixel comes from DOG: characters, walk cycles, attacks, hits, coins and HUD.">
  <meta property="og:title" content="DOG Quest · a game screen made only from DOG sprites">
  <meta property="og:image" content="https://olebangpad.github.io/dog/docs/img/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="web/style.css">
  <link rel="stylesheet" href="web/game.css">
  <link rel="icon" id="favicon">
</head>
<body class="game-page">
  <header class="top">
    <a class="brand" href="./" aria-label="DOG home">
      <span class="brand-name">DOG</span>
      <span class="brand-sub">Quest · demo</span>
    </a>
    <p class="stats">Every pixel on this screen comes from DOG</p>
    <nav class="top-nav">
      <a href="./#maker">Make a character</a>
      <a class="star" href="https://github.com/olebangpad/dog">★ Star on GitHub</a>
    </nav>
  </header>

  <main class="game-wrap">
    <div class="screen" id="screen">
      <canvas id="game" aria-label="DOG Quest game screen"></canvas>
      <div class="pad" id="pad" aria-hidden="true">
        <div class="dpad">
          <button data-key="ArrowUp" class="up">▲</button>
          <button data-key="ArrowLeft" class="left">◀</button>
          <button data-key="ArrowRight" class="right">▶</button>
          <button data-key="ArrowDown" class="down">▼</button>
        </div>
        <button data-key=" " class="a">A</button>
      </div>
    </div>
    <div class="game-bar">
      <p class="hint">Move: arrows / WASD or the pad · Attack: space or A · It plays itself until you take over.</p>
      <div class="row wrap">
        <button class="btn primary" id="new-hero">🎲 New hero</button>
        <a class="btn" id="edit-hero" href="./#maker">Edit this hero</a>
      </div>
      <pre class="code" id="hero-code"></pre>
    </div>
  </main>
  <script type="module" src="web/game.js"></script>
</body>
</html>
