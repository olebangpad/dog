name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate sprites
        run: node scripts/validate.js
      - name: Tests
        run: node --test test/*.test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type definitions
        run: npx -y -p typescript@5.6.3 tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --lib es2022,dom test/types/usage.ts
      - name: Build assets
        run: node scripts/build.js
      - name: npm package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const [p] = require('./pack.json'); const files = p.files.map((f) => f.path); \
            for (const must of ['src/index.js', 'src/index.d.ts', 'scripts/pixspell.js', 'skills/pixspell/SKILL.md', 'README.md', 'LICENSE', 'LICENSE-ASSETS']) if (!files.includes(must)) throw new Error('missing ' + must); \
            if (p.size > 400000) throw new Error('package too big: ' + p.size); console.log(files.length + ' files, ' + p.size + ' bytes')"
      - name: Claude Code plugin manifest
        run: node -e "const m = require('./.claude-plugin/marketplace.json'); if (!m.name || !m.owner || !m.plugins?.length) throw new Error('bad marketplace.json'); require('fs').accessSync(m.plugins[0].source + '/SKILL.md')"
