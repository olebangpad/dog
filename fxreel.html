<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080">
  <title>DOG · effects reel</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
  <style>
    /* A 1080x1920 vertical frame for an effects reel: the count, then themed pages of effects.
       ?lang=ko for Korean captions. Recorded by scripts/record-promo.cjs. */
    :root { --bg: #101712; --ink: #e8f3e4; --muted: #8aa592; --accent: #a8e05a; --gold: #ffd06a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { width: 1080px; height: 1920px; font-family: 'Silkscreen', monospace; display: flex; flex-direction: column; align-items: center; }
    canvas { image-rendering: pixelated; display: block; }
    .brand { margin-top: 64px; font-size: 40px; color: var(--muted); letter-spacing: 4px; }
    .brand b { color: var(--accent); }
    .count { margin-top: 6px; display: flex; align-items: center; gap: 28px; }
    .count span { font-size: 190px; line-height: 1; font-weight: 700; color: var(--gold); min-width: 3ch; text-align: right; }
    .count small { font-size: 54px; line-height: 1.05; color: var(--ink); }
    #grid { margin-top: 40px; width: 1024px; height: 1024px; }
    .dots { margin-top: 26px; display: flex; gap: 14px; }
    .dots i { width: 16px; height: 16px; background: #2b3b30; }
    .dots i.on { background: var(--accent); }
    .caption { margin-top: 26px; height: 120px; display: grid; place-items: center; text-align: center; font-size: 64px; line-height: 1.1; padding: 0 40px; }
    .caption b { color: var(--accent); font-weight: 700; }
    body.ko .caption, body.ko .count small, body.ko .cta small { font-family: 'Do Hyeon', 'Silkscreen', sans-serif; }
    body.ko .caption { font-size: 84px; }
    body.ko .count small { font-size: 74px; }
    .cta { margin-top: auto; margin-bottom: 70px; text-align: center; }
    .cta div { font-size: 50px; background: #1f2c23; border: 4px solid var(--accent); border-radius: 18px; padding: 16px 34px; }
    .cta small { display: block; margin-top: 16px; font-size: 34px; color: var(--muted); }
    body.ko .cta small { font-size: 46px; }
  </style>
</head>
<body>
  <div class="brand"><b>DOG</b> · DOTS OF GAMES</div>
  <div class="count"><span id="count">0</span><small id="count-label"></small></div>
  <canvas id="grid" width="1024" height="1024"></canvas>
  <div class="dots" id="dots"></div>
  <div class="caption" id="caption"></div>
  <div class="cta">
    <div>★ github.com/olebangpad/dog</div>
    <small id="cta-sub"></small>
  </div>
  <script type="module" src="web/fxreel.js"></script>
</body>
</html>
