<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080">
  <title>DOG · promo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Do+Hyeon&display=swap" rel="stylesheet">
  <style>
    /* A 1080x1920 vertical frame for recording reels / shorts. ?lang=ko for Korean captions,
       ?mode=clip for a canvas-only landscape clip. */
    :root { --bg: #101712; --ink: #e8f3e4; --muted: #8aa592; --accent: #a8e05a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
    body { width: 1080px; height: 1920px; font-family: 'Silkscreen', monospace; display: flex; flex-direction: column; align-items: center; }
    canvas { image-rendering: pixelated; display: block; }
    .title { margin-top: 90px; font-size: 190px; line-height: 1; color: var(--accent); letter-spacing: 10px; font-weight: 700; }
    .tag { margin-top: 18px; font-size: 44px; color: var(--muted); letter-spacing: 2px; }
    .game { margin-top: 56px; border: 6px solid #2b3b30; border-radius: 18px; overflow: hidden; }
    #game { width: 1024px; height: 768px; }
    .caption {
      margin-top: 52px; height: 150px; display: grid; place-items: center; text-align: center;
      font-size: 64px; line-height: 1.15; padding: 0 40px;
    }
    .caption b { color: var(--accent); font-weight: 700; }
    body.ko .caption, body.ko .cta small { font-family: 'Do Hyeon', 'Silkscreen', sans-serif; font-size: 82px; }
    body.ko .cta small { font-size: 46px; }
    #strip { margin-top: 30px; width: 960px; height: 160px; }
    .cta { margin-top: auto; margin-bottom: 90px; text-align: center; }
    .cta div { font-size: 50px; color: var(--ink); background: #1f2c23; border: 4px solid var(--accent); border-radius: 18px; padding: 18px 34px; }
    .cta small { display: block; margin-top: 18px; font-size: 34px; color: var(--muted); }
    /* clip mode: just the game, landscape */
    body.clip { width: auto; height: auto; }
    body.clip > :not(.game) { display: none; }
    body.clip .game { margin: 0; border: 0; border-radius: 0; }
  </style>
</head>
<body>
  <div class="title">DOG</div>
  <div class="tag">DOTS OF GAMES</div>
  <div class="game"><canvas id="game"></canvas></div>
  <div class="caption" id="caption"></div>
  <canvas id="strip" width="240" height="40"></canvas>
  <div class="cta">
    <div>★ github.com/olebangpad/dog</div>
    <small id="cta-sub"></small>
  </div>
  <script type="module" src="web/promo.js"></script>
</body>
</html>
